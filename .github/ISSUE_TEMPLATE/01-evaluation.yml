{
  "name": "RC4 evaluation and support intent",
  "description": "설치/검사/가치/49,000원 지원 의향을 각각 기록",
  "title": "[EVAL] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "評価/テストのみ / 평가·테스트 전용. 개인정보/고객파일/토큰 금지. 지원 의향은 결제/계약 아님. [평가조건](https://github.com/sirundae/arche-shield-evaluation/blob/release/rc4-eval1/EVALUATION_TERMS.md)."
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Release version",
        "placeholder": "0.1.0-rc4-eval1"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Windows / Python version",
        "placeholder": "Windows11 / Python3.12"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "install",
      "attributes": {
        "label": "Install success",
        "options": [
          "YES",
          "NO",
          "NOT_TRIED"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "inspection",
      "attributes": {
        "label": "First successful inspection",
        "options": [
          "YES",
          "NO",
          "NOT_TRIED"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "value",
      "attributes": {
        "label": "Concrete value statement",
        "description": "도움이 된 실제 합성 평가 사례 또는 NONE. 원본 업무 경로/내용 금지."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "support",
      "attributes": {
        "label": "KRW49000 one-time support intent",
        "options": [
          "YES",
          "NO",
          "CONDITIONAL"
        ],
        "description": "라이선스 구매 아님. 최대60분+평가기간 후속1회 지원 가격 가설."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "conditions",
      "attributes": {
        "label": "Support conditions / synthetic error",
        "description": "필요 조건 또는 NONE. 계정/결제정보 금지."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "commercial",
      "attributes": {
        "label": "Commercial / production / team use requested",
        "options": [
          "NO",
          "YES"
        ],
        "description": "YES는 이용권을 주지 않고 Owner 결정 문의로 기록합니다."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
